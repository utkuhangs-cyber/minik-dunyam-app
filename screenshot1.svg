<svg width="1280" height="720" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  
  <!-- Phone mockup -->
  <rect x="440" y="60" width="400" height="600" rx="30" fill="#1f2937" opacity="0.8"/>
  <rect x="460" y="80" width="360" height="560" rx="10" fill="#fff"/>
  
  <!-- Header -->
  <rect x="460" y="80" width="360" height="80" rx="10" fill="url(#bgGrad)"/>
  <text x="640" y="115" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">Minik Dünyam</text>
  <text x="640" y="145" font-size="14" fill="#fff" text-anchor="middle" opacity="0.9">Çocuğunuzun gelişim takibi</text>
  
  <!-- Baby Card -->
  <rect x="480" y="180" width="320" height="120" rx="15" fill="#f3f4f6"/>
  <circle cx="530" cy="230" r="30" fill="url(#bgGrad)"/>
  <text x="530" y="240" font-size="30" text-anchor="middle">👶</text>
  <text x="580" y="225" font-size="18" font-weight="bold" fill="#1f2937">Minik Dünyam</text>
  <text x="580" y="245" font-size="14" fill="#6b7280">0 ay • 0 gün</text>
  
  <!-- Stats -->
  <rect x="480" y="320" width="150" height="80" rx="10" fill="#ddd6fe"/>
  <text x="555" y="350" font-size="28" text-anchor="middle">📏</text>
  <text x="555" y="375" font-size="12" text-anchor="middle" fill="#5b21b6">Boy</text>
  <text x="555" y="395" font-size="14" font-weight="bold" text-anchor="middle" fill="#5b21b6">50 cm</text>
  
  <rect x="650" y="320" width="150" height="80" rx="10" fill="#fce7f3"/>
  <text x="725" y="350" font-size="28" text-anchor="middle">⚖️</text>
  <text x="725" y="375" font-size="12" text-anchor="middle" fill="#9f1239">Kilo</text>
  <text x="725" y="395" font-size="14" font-weight="bold" text-anchor="middle" fill="#9f1239">3.5 kg</text>
  
  <!-- Features -->
  <rect x="480" y="420" width="100" height="80" rx="10" fill="#dbeafe"/>
  <text x="530" y="455" font-size="24" text-anchor="middle">🍼</text>
  <text x="530" y="485" font-size="11" text-anchor="middle" fill="#1e40af">Beslenme</text>
  
  <rect x="590" y="420" width="100" height="80" rx="10" fill="#fef3c7"/>
  <text x="640" y="455" font-size="24" text-anchor="middle">📊</text>
  <text x="640" y="485" font-size="11" text-anchor="middle" fill="#92400e">İstatistik</text>
  
  <rect x="700" y="420" width="100" height="80" rx="10" fill="#dcfce7"/>
  <text x="750" y="455" font-size="24" text-anchor="middle">🏥</text>
  <text x="750" y="485" font-size="11" text-anchor="middle" fill="#14532d">Sağlık</text>
  
  <!-- Bottom text -->
  <text x="640" y="580" font-size="12" text-anchor="middle" fill="#6b7280">+ 12 özellik daha...</text>
  
  <!-- Title -->
  <text x="640" y="680" font-size="48" font-weight="bold" fill="#fff" text-anchor="middle">Minik Dünyam</text>
  <text x="640" y="710" font-size="20" fill="#fff" text-anchor="middle" opacity="0.9">Çocuklarınızın dünyası, sizin elinizde! 💝</text>
</svg>

